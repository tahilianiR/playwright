<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Playwright notes</title>
<style>
  :root {
    color-scheme: light;
    /* Saved themes (previous):
       Medium gray: --bg #B4B9C0; --panel #A7ACB4; --ink #080A0D; --muted #2F353E;
                    --line #8D939C; --accent #103E63; --accent-soft #98AFC4; --code-bg #A9AEB6;
       Off-white:   --bg #F5F5F0; --panel #EAEAE3; --ink #1A1C20; --muted #5A5F66;
                    --line #D6D6CD; --accent #1D4F7A; --accent-soft #DCE6EE; --code-bg #E9E9E2; */
    /* Warm off-white replaced white:  --bg #FFFFFF; --panel #F5F6F7; --ink #1C1E21; --muted #606770; --line #DADDE1; --accent #1A7E1F; --accent-soft #E2F2E3; --code-bg #F0F2F4 */
    /* Slate blue (#6D8196) was: --bg #6D8196; --panel #8394A8; --ink #080C10; --muted #141C25; --line #4B5D70; --accent #04210A; --accent-soft #A9B8C8; --code-bg #8CA0B3 */
    /* Neutral off-white was: --bg #F5F5F4; --panel #EAEAE9; --ink #212327; --muted #62666C; --line #D8D8D6; --accent #2C6B35; --accent-soft #E0ECE2; --code-bg #E8E8E6; chip border #CDCDCA */
    /* Taupe was: --bg #928179; --panel #A49489; --ink #0A0A0B; --muted #1E1A18; --line #6F615A; --accent #0B2E12; --accent-soft #B8AAA0; --code-bg #A99A90; chip border #6F615A */
    /* White was: --bg #FFFFFF; --panel #F5F6F7; --line #DADDE1; --accent-soft #E2F2E3; --code-bg #E8EBEF; chip border #CBD0D6 */
    /* Neutral gray was: --bg #F2F2F2; --panel #E6E6E6; --line #D2D2D2; --accent-soft #DCEBDD; --code-bg #E3E3E3; chip border #C6C6C6 */
    --bg: #FFFFFF;
    --panel: #F5F6F7;
    --ink: #1C1E21;
    --muted: #606770;
    --line: #DADDE1;
    --accent: #1A7E1F;
    --accent-soft: #E2F2E3;
    --code-bg: #E8EBEF;
    --sans: Verdana, Geneva, Tahoma, sans-serif;
    --mono: SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
  }
  /* Dark variant (not used): --bg #0C0C0E; --panel #141416; --ink #E3E3E3; --muted #A3A8AF; --line #2A2D32; --accent #45BA4B; --accent-soft #1F3A22; */
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.7 var(--sans);
    display: grid;
    grid-template-columns: 280px 1fr;
  }

  /* Sidebar */
  aside {
    background: var(--panel);
    border-right: 1px solid var(--line);
    height: 100vh;
    position: sticky;
    top: 0;
    overflow-y: auto;
    padding: 28px 20px 40px;
  }
  .brand {
    font-weight: 700;
    font-size: 1.25rem;
    letter-spacing: -0.01em;
    margin: 0 0 18px;
  }
  .brand small {
    display: block;
    font-weight: 400;
    font-size: 0.85rem;
    color: var(--muted);
  }
  .search {
    width: 100%;
    font: inherit;
    font-size: 0.95rem;
    padding: 8px 10px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--bg);
    color: var(--ink);
    margin-bottom: 22px;
  }
  .section-title {
    font-size: 0.85rem;
    font-weight: 700;
    color: var(--muted);
    margin: 20px 0 6px 10px;
  }
  nav ul { list-style: none; margin: 0; padding: 0; }
  nav a {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 10px;
    border-radius: 6px;
    color: var(--ink);
    text-decoration: none;
    font-size: 0.97rem;
  }
  nav a::before {
    content: "";
    width: 7px; height: 7px;
    border-radius: 50%;
    border: 1.5px solid var(--muted);
    flex: none;
  }
  nav a:hover { background: var(--bg); }
  nav a[aria-current="page"] {
    background: var(--accent-soft);
    color: var(--accent);
    font-weight: 700;
  }
  nav a[aria-current="page"]::before {
    background: var(--accent);
    border-color: var(--accent);
  }
  .empty-filter { color: var(--muted); font-size: 0.9rem; padding: 0 10px; }

  /* Main */
  main {
    padding: 48px 56px 80px;
    min-width: 0;
  }
  article { max-width: 72ch; }
  article h1 {
    font-size: 2.3rem;
    line-height: 1.15;
    letter-spacing: -0.02em;
    margin: 0 0 24px;
    color: #1A7E1F;
  }
  article h2 {
    font-size: 1.35rem;
    margin: 28px 0 10px;
    color: #000000;
  }
  article h3 { font-size: 1.1rem; margin: 28px 0 8px; color: #2563EB; }
  .subtopics {
    margin: 0 0 24px;
    padding: 10px 10px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
  }
  .subtopics ul { margin: 0; padding-left: 14px; }
  .subtopics a { color: #2563EB; text-decoration: none; }
  .subtopics a:hover { text-decoration: underline; }
  article h4 { font-size: 1rem; margin: 22px 0 6px; }
  article a { color: var(--accent); }
  article code {
    font-family: var(--mono);
    font-size: 0.86em;
    background: var(--code-bg);
    border: 1px solid #CBD0D6;
    padding: 1px 5px;
    border-radius: 4px;
  }
  /* Code blocks: VS Code Dark+ look */
  article pre {
    background: #1F1F1F;
    color: #D4D4D4;
    border: 1px solid #3C3C3C;
    border-radius: 8px;
    padding: 16px 18px;
    overflow-x: auto;
    font-size: 0.95rem;
    line-height: 1.6;
  }
  article pre code { background: none; border: 0; padding: 0; font-size: inherit; color: inherit; }
  pre code.hljs { background: none; padding: 0; }
  .hljs-keyword, .hljs-literal, .hljs-selector-tag, .hljs-doctag { color: #569CD6; }
  .hljs-string, .hljs-regexp, .hljs-template-variable, .hljs-addition { color: #CE9178; }
  .hljs-comment, .hljs-quote { color: #6A9955; font-style: normal; }
  .hljs-number, .hljs-symbol, .hljs-bullet { color: #B5CEA8; }
  .hljs-title, .hljs-title.function_, .hljs-section { color: #DCDCAA; }
  .hljs-title.class_, .hljs-type, .hljs-built_in, .hljs-name, .hljs-tag { color: #4EC9B0; }
  .hljs-variable, .hljs-attr, .hljs-attribute, .hljs-property, .hljs-params, .hljs-subst { color: #9CDCFE; }
  .hljs-meta, .hljs-deletion { color: #C586C0; }
  /* Extra token classes added by vscodeColors() */
  .vs-ctl { color: #C586C0; }
  .vs-kw { color: #569CD6; }
  .vs-fn { color: #DCDCAA; }
  .vs-var { color: #9CDCFE; }
  .vs-type { color: #4EC9B0; }
  .vs-b0 { color: #FFD700; }
  .vs-b1 { color: #DA70D6; }
  .vs-b2 { color: #179FFF; }
  article blockquote {
    margin: 16px 0;
    padding: 4px 16px;
    border-left: 3px solid var(--accent);
    color: var(--muted);
  }
  article table { border-collapse: collapse; display: block; overflow-x: auto; }
  article th, article td { border: 1px solid var(--line); padding: 6px 10px; text-align: left; }
  article img { max-width: 100%; }

  .pager {
    max-width: 72ch;
    display: flex;
    justify-content: space-between;
    gap: 16px;
    margin-top: 56px;
    padding-top: 20px;
    border-top: 1px solid var(--line);
  }
  .pager a {
    color: var(--ink);
    text-decoration: none;
    display: flex;
    flex-direction: column;
    font-weight: 700;
  }
  .pager a span { font-weight: 400; font-size: 0.85rem; color: var(--muted); }
  .pager a.next { text-align: right; margin-left: auto; }
  .pager a:hover { color: var(--accent); }

  .notice {
    max-width: 64ch;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 20px 24px;
    background: var(--panel);
  }
  .notice h1 { font-size: 1.4rem; margin-top: 0; }

  /* Notes / Interview questions tabs */
  .tabs { display: flex; gap: 8px; margin: 0 0 24px; border-bottom: 1px solid var(--line); }
  .tabs a {
    padding: 8px 14px;
    color: var(--muted);
    text-decoration: none;
    font-weight: 700;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
  }
  .tabs a:hover { color: var(--ink); }
  .tabs a[aria-current="page"] { color: var(--accent); border-bottom-color: var(--accent); }

  /* Interview questions */
  .q-bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; color: var(--muted); font-size: 0.9rem; margin-bottom: 16px; }
  .q-card { border: 1px solid var(--line); border-radius: 8px; padding: 18px 20px; margin: 0 0 18px; background: var(--panel); }
  .q-card .q-title { font-weight: 700; margin: 0 0 12px; }
  .q-card .q-title small { color: var(--muted); font-weight: 400; margin-right: 6px; }
  .q-opt, .q-btn {
    font: inherit;
    color: var(--ink);
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 8px 12px;
    cursor: pointer;
  }
  .q-opt { display: block; width: 100%; text-align: left; margin: 0 0 8px; }
  .q-opt:hover:not(:disabled), .q-btn:hover { border-color: var(--accent); }
  .q-opt:disabled { cursor: default; color: var(--ink); opacity: 1; }
  .q-opt.correct { border-color: #2E9E4F; background: rgba(46, 158, 79, 0.18); }
  .q-opt.wrong { border-color: #D14B4B; background: rgba(209, 75, 75, 0.18); }
  .q-answer { margin-top: 14px; padding-top: 12px; border-top: 1px dashed var(--line); }
  .q-answer > :first-child { margin-top: 0; }
  .q-answer > :last-child { margin-bottom: 0; }
  .q-result { font-weight: 700; margin: 4px 0 8px; }

  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .menu-btn { display: none; }

  @media (max-width: 800px) {
    body { grid-template-columns: 1fr; }
    aside {
      position: fixed;
      inset: 0 auto 0 0;
      width: 280px;
      z-index: 10;
      transform: translateX(-100%);
      transition: transform 0.2s ease;
    }
    body.menu-open aside { transform: none; box-shadow: 0 0 0 100vw rgba(0,0,0,0.35); }
    main { padding: 72px 20px 60px; }
    .menu-btn {
      display: block;
      position: fixed;
      top: 14px; left: 14px;
      z-index: 5;
      font: inherit;
      font-size: 0.95rem;
      padding: 6px 12px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--panel);
      color: var(--ink);
    }
    article h1 { font-size: 1.8rem; }
  }
  @media (prefers-reduced-motion: reduce) { aside { transition: none; } }
</style>
</head>
<body>
  <button class="menu-btn" type="button" aria-controls="sidebar">Topics</button>

  <aside id="sidebar">
    <p class="brand">Playwright notes<small>My learning notebook</small></p>
    <input class="search" type="search" placeholder="Filter topics" aria-label="Filter topics">
    <nav aria-label="Topics"></nav>
  </aside>

  <main>
    <article id="content" aria-live="polite"></article>
    <div class="pager"></div>
  </main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script>
  const nav = document.querySelector('nav');
  const content = document.getElementById('content');
  const pager = document.querySelector('.pager');
  const search = document.querySelector('.search');
  let sections = [];
  let flat = [];

  const slug = file => file.replace(/\.md$/, '');

  function showNotice(title, html) {
    content.innerHTML = `<div class="notice"><h1>${title}</h1>${html}</div>`;
    pager.innerHTML = '';
  }

  function renderNav(filter = '') {
    const q = filter.trim().toLowerCase();
    let html = '';
    for (const s of sections) {
      const items = s.topics.filter(t => !q || t.title.toLowerCase().includes(q));
      if (!items.length) continue;
      html += `<p class="section-title">${s.section}</p><ul>`;
      for (const t of items) {
        html += `<li><a href="#${slug(t.file)}" data-file="${t.file}">${t.title}</a></li>`;
      }
      html += '</ul>';
    }
    nav.innerHTML = html || '<p class="empty-filter">No topic matches that filter.</p>';
    markActive();
  }

  function markActive() {
    const { id: current } = route();
    nav.querySelectorAll('a').forEach(a => {
      if (slug(a.dataset.file) === current) a.setAttribute('aria-current', 'page');
      else a.removeAttribute('aria-current');
    });
  }

  // Finer VS Code-style colors on top of highlight.js: pink control keywords,
  // yellow function calls, light-blue variables, teal types, rainbow brackets.
  const CTL = new Set('import from export default return if else for while do of in await try catch finally throw switch case break continue yield'.split(' '));
  const KW = new Set('const let var function class new async typeof instanceof extends void delete interface type enum implements public private protected readonly static true false null undefined this'.split(' '));
  const SKIP = '.hljs-string, .hljs-comment, .hljs-regexp, .hljs-number, .hljs-quote';

  // Shell blocks: purple command names, light-blue flags (like the Playwright docs).
  function shellColors(code) {
    const walker = document.createTreeWalker(code, NodeFilter.SHOW_TEXT);
    const nodes = [];
    while (walker.nextNode()) nodes.push(walker.currentNode);
    const tok = /\n|&&|\|\||[|;]|--?[A-Za-z][\w-]*|[^\s|&;]+/g;
    let expectCmd = true;
    for (const node of nodes) {
      const parent = node.parentElement;
      if (parent !== code) {
        // string, comment or keyword span: a comment leaves state alone, anything else is a word
        if (!parent.closest('.hljs-comment')) expectCmd = false;
        continue;
      }
      const text = node.textContent;
      const frag = document.createDocumentFragment();
      let last = 0, m;
      while ((m = tok.exec(text))) {
        const t = m[0];
        if (m.index > last) frag.append(text.slice(last, m.index));
        last = m.index + t.length;
        if (/^(\n|&&|\|\||[|;])$/.test(t)) { expectCmd = true; frag.append(t); continue; }
        let cls = null;
        if (/^--?[A-Za-z]/.test(t) && !expectCmd) cls = 'vs-var';
        else if (expectCmd) { cls = 'vs-ctl'; expectCmd = false; }
        if (!cls) { frag.append(t); continue; }
        const sp = document.createElement('span');
        sp.className = cls;
        sp.textContent = t;
        frag.append(sp);
      }
      if (last < text.length) frag.append(text.slice(last));
      node.replaceWith(frag);
    }
  }

  function vscodeColors(code) {
    if (/language-(bash|sh|shell|zsh|console)\b/.test(code.className)) { shellColors(code); return; }
    if (!/language-(typescript|ts|javascript|js|tsx|jsx)\b/.test(code.className)) return;
    code.querySelectorAll('.hljs-keyword, .hljs-literal').forEach(el => {
      const w = el.textContent.trim();
      el.classList.add(CTL.has(w) ? 'vs-ctl' : 'vs-kw');
    });
    const walker = document.createTreeWalker(code, NodeFilter.SHOW_TEXT);
    const nodes = [];
    while (walker.nextNode()) nodes.push(walker.currentNode);
    let depth = 0;
    const tok = /[A-Za-z_$][\w$]*|[()[\]{}]/g;
    for (const node of nodes) {
      const parent = node.parentElement;
      if (parent.closest(SKIP) || parent.closest('.hljs-keyword, .hljs-literal, .hljs-title, .hljs-built_in, .hljs-type')) continue;
      const text = node.textContent;
      const frag = document.createDocumentFragment();
      let last = 0, m;
      const put = (s, cls) => {
        if (!cls) { frag.append(s); return; }
        const sp = document.createElement('span');
        sp.className = cls;
        sp.textContent = s;
        frag.append(sp);
      };
      tok.lastIndex = 0;
      while ((m = tok.exec(text))) {
        if (m.index > last) put(text.slice(last, m.index));
        const t = m[0];
        let cls;
        if ('([{'.includes(t)) cls = 'vs-b' + (depth++ % 3);
        else if (')]}'.includes(t)) cls = 'vs-b' + (Math.max(depth-- - 1, 0) % 3);
        else if (CTL.has(t)) cls = 'vs-ctl';
        else if (KW.has(t)) cls = 'vs-kw';
        else if (/^\s*\(/.test(text.slice(m.index + t.length))) cls = 'vs-fn';
        else if (/^[A-Z]/.test(t) && t !== t.toUpperCase()) cls = 'vs-type';
        else cls = 'vs-var';
        put(t, cls);
        last = m.index + t.length;
      }
      if (last === 0) continue;
      if (last < text.length) put(text.slice(last));
      node.replaceWith(frag);
    }
  }

  const route = () => {
    const [id, view] = location.hash.slice(1).split('/');
    return { id, view: view === 'questions' ? 'questions' : 'notes' };
  };

  function tabsHtml(id, view) {
    const cur = v => (view === v ? ' aria-current="page"' : '');
    return `<div class="tabs"><a href="#${id}"${cur('notes')}>Notes</a><a href="#${id}/questions"${cur('questions')}>Interview questions</a></div>`;
  }

  function renderQuestions(list) {
    let answered = 0, correct = 0;
    const bar = document.createElement('div');
    bar.className = 'q-bar';
    const wrap = document.createElement('div');
    const updateBar = () => {
      const mcq = list.filter(q => q.type === 'mcq').length;
      bar.textContent = `${list.length} questions` + (mcq ? ` · MCQ score: ${correct}/${answered} answered` : '');
    };
    updateBar();

    list.forEach((item, i) => {
      const card = document.createElement('div');
      card.className = 'q-card';
      card.innerHTML = `<p class="q-title"><small>Q${i + 1}</small>${marked.parseInline(item.q || '')}</p>`;

      if (item.type === 'mcq') {
        const result = document.createElement('div');
        const btns = (item.options || []).map((opt, n) => {
          const b = document.createElement('button');
          b.type = 'button';
          b.className = 'q-opt';
          b.innerHTML = marked.parseInline(opt);
          b.addEventListener('click', () => {
            btns.forEach((x, k) => { x.disabled = true; if (k === item.answer) x.classList.add('correct'); });
            const ok = n === item.answer;
            if (!ok) b.classList.add('wrong');
            answered++; if (ok) correct++;
            updateBar();
            result.innerHTML = `<div class="q-answer"><p class="q-result">${ok ? 'Correct' : 'Not quite'}</p>${item.explain ? marked.parse(item.explain) : ''}</div>`;
            result.querySelectorAll('pre code').forEach(el => { hljs.highlightElement(el); vscodeColors(el); });
          });
          card.append(b);
          return b;
        });
        card.append(result);
      } else {
        const show = document.createElement('button');
        show.type = 'button';
        show.className = 'q-btn';
        show.textContent = 'Show answer';
        const ans = document.createElement('div');
        ans.className = 'q-answer';
        ans.hidden = true;
        ans.innerHTML = marked.parse(item.answer || '');
        ans.querySelectorAll('pre code').forEach(el => { hljs.highlightElement(el); vscodeColors(el); });
        show.addEventListener('click', () => {
          ans.hidden = !ans.hidden;
          show.textContent = ans.hidden ? 'Show answer' : 'Hide answer';
        });
        card.append(show, ans);
      }
      wrap.append(card);
    });
    content.append(bar, wrap);
  }

  // List every h3 as a link at the top of the page. The page uses hash routing,
  // so the links scroll with JS instead of changing location.hash.
  function buildSubtopics() {
    const heads = [...content.querySelectorAll('h3')];
    if (!heads.length) return;
    const box = document.createElement('nav');
    box.className = 'subtopics';
    box.setAttribute('aria-label', 'Sub-topics');
    const list = document.createElement('ul');
    heads.forEach((h, i) => {
      h.id = `sub-${i}`;
      const li = document.createElement('li');
      const a = document.createElement('a');
      a.href = `#sub-${i}`;
      a.textContent = h.textContent;
      a.addEventListener('click', e => {
        e.preventDefault();
        h.scrollIntoView({ behavior: 'smooth', block: 'start' });
      });
      li.append(a);
      list.append(li);
    });
    box.append(list);
    const anchor = content.querySelector('h2') || content.querySelector('.tabs');
    if (anchor) anchor.after(box); else content.prepend(box);
  }

  async function loadTopic() {
    const { id: hashId, view } = route();
    const id = hashId || slug(flat[0].file);
    const index = flat.findIndex(t => slug(t.file) === id);
    if (index === -1) {
      showNotice('Topic not found', `<p>There's no topic called <code>${id}</code> in <code>topics.json</code>. Pick one from the list.</p>`);
      return;
    }
    const topic = flat[index];
    markActive();
    document.body.classList.remove('menu-open');

    const tabs = tabsHtml(id, view);

    if (view === 'questions') {
      document.title = `${topic.title} questions – Playwright notes`;
      const qfile = `questions/${slug(topic.file)}.json`;
      try {
        const res = await fetch(qfile, { cache: 'no-store' });
        if (!res.ok) throw new Error(res.status);
        const list = await res.json();
        content.innerHTML = tabs + `<h1>${topic.title}: interview questions</h1>`;
        renderQuestions(list);
      } catch {
        content.innerHTML = tabs + `<div class="notice"><h1>No questions yet</h1><p>Create <code>${qfile}</code> to add interview questions for this topic. See the README for the format.</p></div>`;
      }
    } else try {
      const res = await fetch(`notes/${topic.file}`, { cache: 'no-store' });
      if (!res.ok) throw new Error(res.status);
      const md = await res.text();
      content.innerHTML = tabs + marked.parse(md);
      content.querySelectorAll('pre code').forEach(el => { hljs.highlightElement(el); vscodeColors(el); });
      buildSubtopics();
      document.title = `${topic.title} – Playwright notes`;
    } catch {
      showNotice('Notes file missing', `<p>Couldn't load <code>notes/${topic.file}</code>. Create that file, or fix the file name in <code>topics.json</code>.</p>`);
      return;
    }

    const prev = flat[index - 1];
    const next = flat[index + 1];
    pager.innerHTML =
      (prev ? `<a class="prev" href="#${slug(prev.file)}${view === 'questions' ? '/questions' : ''}"><span>Previous</span>${prev.title}</a>` : '') +
      (next ? `<a class="next" href="#${slug(next.file)}${view === 'questions' ? '/questions' : ''}"><span>Next</span>${next.title}</a>` : '');
    window.scrollTo(0, 0);
  }

  async function init() {
    if (location.protocol === 'file:') {
      showNotice('Start the local server first',
        `<p>Browsers block reading your notes files when this page is opened by double-clicking.</p>
         <p>In a terminal inside this folder, run:</p>
         <pre><code>npx serve</code></pre>
         <p>Then open the address it prints (usually <code>http://localhost:3000</code>). The VS Code "Live Server" extension works too.</p>`);
      return;
    }
    try {
      const res = await fetch('topics.json', { cache: 'no-store' });
      sections = await res.json();
    } catch {
      showNotice('Topic list not readable', '<p>Check that <code>topics.json</code> exists in this folder and is valid JSON (watch for a missing comma or an extra one at the end).</p>');
      return;
    }
    flat = sections.flatMap(s => s.topics);
    renderNav();
    loadTopic();
  }

  window.addEventListener('hashchange', loadTopic);
  search.addEventListener('input', e => renderNav(e.target.value));
  document.querySelector('.menu-btn').addEventListener('click', () => document.body.classList.toggle('menu-open'));
  document.addEventListener('keydown', e => { if (e.key === 'Escape') document.body.classList.remove('menu-open'); });

  init();
</script>
</body>
</html>
